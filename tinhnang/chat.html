<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .chat-header {
      background: #ee4d2d;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }
    .chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }
    .message {
      display: flex;
      margin-bottom: 10px;
    }
    .message .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ccc;
      margin-right: 10px;
    }
    .bubble {
      max-width: 70%;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
    }
    .bubble.user {
      background: #ee4d2d;
      color: white;
      margin-left: auto;
    }
    .bubble.other {
      background: #fff;
      border: 1px solid #ddd;
    }
    .chat-input {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: white;
    }
    .chat-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
    }
    .chat-input button {
      background: #ee4d2d;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-left: 10px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header"> Chat</div>
    <div class="chat-box" id="chat-box">
      <div class="message">
        <div class="avatar"></div>
        <div class="bubble other">Xin chào, bạn cần hỗ trợ gì?</div>
      </div>
    </div>
    <div class="chat-input">
      <input type="text" id="message-input" placeholder="Nhập tin nhắn...">
      <button id="send-btn">Gửi</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    function sendMessage() {
      const message = input.value.trim();
      if (message) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message');
        msgDiv.innerHTML = `<div class="bubble user">${message}</div>`;
        chatBox.appendChild(msgDiv);
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    sendBtn.addEventListener('click', sendMessage);

    // Cho phép nhấn Enter để gửi
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
