<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKINSHOP - Đăng nhập</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #333;
      }

      /* ===== HEADER ===== */
      header {
        height: 84px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12%;
        border-bottom: 1px solid #eee;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 25px;
      }

      .logo {
        color: #ff4d6d;
        font-size: 28px;
        font-weight: bold;
      }

      .header-title {
        font-size: 24px;
      }

      .help {
        color: #ff4d6d;
        text-decoration: none;
        font-size: 14px;
      }

      /* ===== MAIN ===== */
      main {
        min-height: calc(100vh - 84px);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* ===== BOX ===== */
      .auth-box {
        width: 400px;
        background: white;
        padding: 30px;
        border-radius: 5px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      }

      .title {
        text-align: center;
        font-size: 24px;
        margin-bottom: 25px;
      }

      /* ===== INPUT ===== */
      .input-box {
        position: relative;
        margin-bottom: 15px;
      }

      input {
        width: 100%;
        height: 45px;
        border: 1px solid #ddd;
        border-radius: 3px;
        padding: 0 12px;
        font-size: 14px;
        outline: none;
      }

      input:focus {
        border-color: #ff4d6d;
      }

      /* ===== PASSWORD ===== */
      .password input {
        padding-right: 45px;
      }

      .eye {
        position: absolute;
        right: 13px;
        top: 13px;
        cursor: pointer;
      }

      /* ===== BUTTON ===== */
      .btn {
        width: 100%;
        height: 45px;
        border: none;
        border-radius: 3px;
        background: #ff4d6d;
        color: white;
        font-weight: bold;
        cursor: pointer;
        margin-top: 5px;
      }

      .btn:hover {
        background: #ff4d6d;
      }

      /* ===== FORGOT ===== */
      .forgot {
        text-align: right;
        margin-top: 12px;
      }

      .forgot a {
        color: #05a;
        font-size: 13px;
        text-decoration: none;
      }

      /* ===== OR ===== */
      .or {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #999;
        font-size: 12px;
        margin: 25px 0;
      }

      .or::before,
      .or::after {
        content: "";
        height: 1px;
        background: #ddd;
        flex: 1;
      }

      /* ===== SOCIAL ===== */
      .social {
        display: flex;
        gap: 10px;
      }

      .social button {
        flex: 1;
        height: 40px;
        background: white;
        border: 1px solid #ddd;
        cursor: pointer;
        border-radius: 3px;
      }

      /* ===== SWITCH ===== */
      .switch {
        text-align: center;
        margin-top: 25px;
        color: #999;
        font-size: 14px;
      }

      .switch span {
        color: #ff4d6d;
        font-weight: bold;
        cursor: pointer;
      }

      /* ===== POLICY ===== */
      .policy {
        text-align: center;
        color: #888;
        font-size: 12px;
        line-height: 1.6;
        margin-top: 20px;
      }

      .policy a {
        color: #ff4d6d;
        text-decoration: none;
      }

      /* ===== MESSAGE ===== */
      .message {
        display: none;
        padding: 10px;
        margin-bottom: 15px;
        text-align: center;
        font-size: 13px;
        border-radius: 3px;
      }

      .error {
        display: block;
        color: #ff4d6d;
        background: #fff1f0;
      }

      .success {
        display: block;
        color: #188038;
        background: #f0fff4;
      }

      .hidden {
        display: none;
      }

      /* ===== MOBILE ===== */
      @media (max-width: 600px) {
        header {
          padding: 0 20px;
        }

        .help {
          display: none;
        }

        .logo {
          font-size: 22px;
        }

        .header-title {
          font-size: 18px;
        }

        .auth-box {
          width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header>
      <div class="header-left">
        <div class="logo">SKINSHOP</div>
        <div class="header-title" id="headerTitle">Đăng nhập</div>
      </div>

      <a href="#" class="help"> Bạn cần trợ giúp? </a>
    </header>

    <!-- ================= MAIN ================= -->

    <main>
      <div class="auth-box">
        <!-- ============ ĐĂNG NHẬP ============ -->

        <div id="loginForm">
          <div class="title">Đăng nhập</div>

          <div id="loginMessage" class="message"></div>

          <div class="input-box">
            <input
              type="text"
              id="loginUsername"
              placeholder="Email / Số điện thoại / Tên đăng nhập"
            />
          </div>

          <div class="input-box password">
            <input type="password" id="loginPassword" placeholder="Mật khẩu" />

            <span class="eye" onclick="showPassword('loginPassword', this)">
              👁
            </span>
          </div>

          <button class="btn" onclick="login()">ĐĂNG NHẬP</button>

          <div class="forgot">
            <a href="#"> Quên mật khẩu? </a>
          </div>

          <div class="switch">
            Bạn chưa có tài khoản?
            <span onclick="showRegister()"> Đăng ký </span>
          </div>
        </div>

        <!-- ============ ĐĂNG KÝ ============ -->

        <div id="registerForm" class="hidden">
          <div class="title">Đăng ký</div>

          <div id="registerMessage" class="message"></div>

          <div class="input-box">
            <input
              type="text"
              id="registerUsername"
              placeholder="Tên đăng nhập"
            />
          </div>

          <div class="input-box">
            <input type="email" id="registerEmail" placeholder="Email" />
          </div>

          <div class="input-box">
            <input type="tel" id="registerPhone" placeholder="Số điện thoại" />
          </div>

          <div class="input-box password">
            <input
              type="password"
              id="registerPassword"
              placeholder="Mật khẩu"
            />

            <span class="eye" onclick="showPassword('registerPassword', this)">
              👁
            </span>
          </div>

          <div class="input-box password">
            <input
              type="password"
              id="registerConfirm"
              placeholder="Nhập lại mật khẩu"
            />

            <span class="eye" onclick="showPassword('registerConfirm', this)">
              👁
            </span>
          </div>

          <button class="btn" onclick="register()">ĐĂNG KÝ</button>

          <div class="policy">
            Bằng việc đăng ký, bạn đồng ý với
            <a href="#">Điều khoản</a>
            và
            <a href="#">Chính sách bảo mật</a>
            của SKINSHOP.
          </div>

          <div class="switch">
            Bạn đã có tài khoản?
            <span onclick="showLogin()"> Đăng nhập </span>
          </div>
        </div>
      </div>
    </main>

    <!-- ================= JAVASCRIPT ================= -->

    <script>
      // ===== CHUYỂN SANG ĐĂNG KÝ =====

      function showRegister() {
        document.getElementById("loginForm").classList.add("hidden");

        document.getElementById("registerForm").classList.remove("hidden");

        document.getElementById("headerTitle").textContent = "Đăng ký";

        document.title = "SKINSHOP - Đăng ký";
      }

      // ===== CHUYỂN SANG ĐĂNG NHẬP =====

      function showLogin() {
        document.getElementById("registerForm").classList.add("hidden");

        document.getElementById("loginForm").classList.remove("hidden");

        document.getElementById("headerTitle").textContent = "Đăng nhập";

        document.title = "SKINSHOP - Đăng nhập";
      }

      // ===== HIỆN / ẨN MẬT KHẨU =====

      function showPassword(id, icon) {
        const input = document.getElementById(id);

        if (input.type === "password") {
          input.type = "text";
          icon.textContent = "🙈";
        } else {
          input.type = "password";
          icon.textContent = "👁";
        }
      }

      // ===== ĐĂNG KÝ =====

      function register() {
        const username = document
          .getElementById("registerUsername")
          .value.trim();

        const email = document.getElementById("registerEmail").value.trim();

        const phone = document.getElementById("registerPhone").value.trim();

        const password = document.getElementById("registerPassword").value;

        const confirm = document.getElementById("registerConfirm").value;

        const message = document.getElementById("registerMessage");

        // Kiểm tra nhập đủ

        if (
          username === "" ||
          email === "" ||
          phone === "" ||
          password === "" ||
          confirm === ""
        ) {
          showMessage(message, "Vui lòng nhập đầy đủ thông tin!", "error");

          return;
        }

        // Kiểm tra mật khẩu

        if (password.length < 6) {
          showMessage(message, "Mật khẩu phải có ít nhất 6 ký tự!", "error");

          return;
        }

        // Kiểm tra mật khẩu nhập lại

        if (password !== confirm) {
          showMessage(message, "Mật khẩu nhập lại không khớp!", "error");

          return;
        }

        // Tạo tài khoản

        const user = {
          username: username,
          email: email,
          phone: phone,
          password: password,
        };

        // Lưu tài khoản

        localStorage.setItem("skinshopUser", JSON.stringify(user));

        // Thông báo

        showMessage(message, "Đăng ký thành công!", "success");

        // Sau 1 giây chuyển sang đăng nhập

        setTimeout(function () {
          showLogin();

          document.getElementById("loginUsername").value = username;
        }, 1000);
      }

      // ===== ĐĂNG NHẬP =====

      function login() {
        const username = document.getElementById("loginUsername").value.trim();

        const password = document.getElementById("loginPassword").value;

        const message = document.getElementById("loginMessage");

        // Lấy tài khoản

        const savedUser = localStorage.getItem("skinshopUser");

        // Chưa đăng ký

        if (!savedUser) {
          showMessage(
            message,
            "Bạn chưa có tài khoản. Hãy đăng ký trước!",
            "error",
          );

          return;
        }

        const user = JSON.parse(savedUser);

        // Kiểm tra tài khoản

        const correctUsername =
          username === user.username ||
          username === user.email ||
          username === user.phone;

        // Đăng nhập thành công

        if (correctUsername && password === user.password) {
          localStorage.setItem("isLoggedIn", "true");

          localStorage.setItem("currentUser", user.username);

          showMessage(message, "Đăng nhập thành công!", "success");

          // Nếu có trang chủ thì chuyển về index.html

          setTimeout(function () {
            window.location.href = "index.html";
          }, 1000);
        } else {
          showMessage(
            message,
            "Tên đăng nhập hoặc mật khẩu không đúng!",
            "error",
          );
        }
      }

      // ===== HIỂN THỊ THÔNG BÁO =====

      function showMessage(element, text, type) {
        element.textContent = text;

        element.className = "message " + type;
      }

      // ===== ENTER ĐỂ ĐĂNG NHẬP / ĐĂNG KÝ =====

      document.addEventListener("keydown", function (event) {
        if (event.key !== "Enter") return;

        const loginVisible = !document
          .getElementById("loginForm")
          .classList.contains("hidden");

        if (loginVisible) {
          login();
        } else {
          register();
        }
      });
    </script>
  </body>
</html>
