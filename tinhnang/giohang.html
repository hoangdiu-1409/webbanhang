<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <title>Giỏ hàng - SKINSHOP</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
      }

      .header {
        background: #ff4d6d;
        color: white;
        padding: 20px;
        font-size: 24px;
        font-weight: bold;
      }

      .container {
        max-width: 1000px;
        margin: 30px auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
      }

      .cart-item {
        display: flex;
        align-items: center;
        gap: 20px;

        padding: 20px 0;
        border-bottom: 1px solid #ddd;
      }

      .cart-item img {
        width: 100px;
        height: 100px;
        object-fit: contain;
        border: 1px solid #eee;
        border-radius: 5px;
      }

      .product-info {
        flex: 1;
      }

      .product-name {
        font-weight: bold;
        margin-bottom: 10px;
      }

      .price {
        color: #ee4d2d;
        font-size: 18px;
        font-weight: bold;
      }

      .quantity {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .quantity button {
        width: 30px;
        height: 30px;
        border: 1px solid #ccc;
        background: white;
        cursor: pointer;
      }

      .quantity span {
        min-width: 30px;
        text-align: center;
      }

      .delete {
        border: none;
        background: #ff4d6d;
        color: white;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
      }

      .bottom {
        margin-top: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .total {
        font-size: 22px;
        font-weight: bold;
        color: #ee4d2d;
      }

      .checkout {
        background: #ee4d2d;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
      }

      .empty {
        text-align: center;
        padding: 50px;
        color: #777;
        font-size: 20px;
      }

      .back {
        display: inline-block;
        margin-bottom: 20px;
        text-decoration: none;
        color: #333;
      }
    </style>
  </head>

  <body>
    <div class="header">🛍️ SKINSHOP - Giỏ hàng</div>

    <div class="container">
      <a href="index.html" class="back"> ← Tiếp tục mua sắm </a>

      <h2>Giỏ hàng của bạn</h2>

      <div id="cart"></div>

      <div class="bottom">
        <div class="total">
          Tổng tiền:
          <span id="total">0₫</span>
        </div>

        <button class="checkout" onclick="checkout()">Thanh toán</button>
      </div>
    </div>

    <script>
      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      function renderCart() {
        const cartDiv = document.getElementById("cart");
        const totalElement = document.getElementById("total");

        cartDiv.innerHTML = "";

        let total = 0;

        // Không có sản phẩm
        if (cart.length === 0) {
          cartDiv.innerHTML = `
            <div class="empty">
                🛒 Giỏ hàng đang trống
            </div>
        `;

          totalElement.textContent = "0₫";
          return;
        }

        // Hiển thị sản phẩm
        cart.forEach(function (item, index) {
          // Đảm bảo số lượng luôn có
          if (!item.qty) {
            item.qty = 1;
          }

          // Đảm bảo giá là số
          let price = Number(item.price) || 0;

          let itemTotal = price * item.qty;

          total += itemTotal;

          cartDiv.innerHTML += `
            <div class="cart-item">

                <img
                    src="${item.image}"
                    alt="${item.name}"
                >

                <div class="product-info">

                    <div class="product-name">
                        ${item.name}
                    </div>

                    <div class="price">
                        ${price.toLocaleString("vi-VN")}₫
                    </div>

                </div>

                <div class="quantity">

                    <button onclick="changeQty(${index}, -1)">
                        −
                    </button>

                    <span>
                        ${item.qty}
                    </span>

                    <button onclick="changeQty(${index}, 1)">
                        +
                    </button>

                </div>

                <button
                    class="delete"
                    onclick="removeItem(${index})"
                >
                    Xóa
                </button>

            </div>
        `;
        });

        totalElement.textContent = total.toLocaleString("vi-VN") + "₫";

        // Lưu lại
        localStorage.setItem("cart", JSON.stringify(cart));
      }

      // ==========================
      // TĂNG / GIẢM SỐ LƯỢNG
      // ==========================

      function changeQty(index, amount) {
        cart[index].qty += amount;

        if (cart[index].qty <= 0) {
          cart.splice(index, 1);
        }

        localStorage.setItem("cart", JSON.stringify(cart));

        renderCart();
      }

      // ==========================
      // XÓA SẢN PHẨM
      // ==========================

      function removeItem(index) {
        cart.splice(index, 1);

        localStorage.setItem("cart", JSON.stringify(cart));

        renderCart();
      }

      // ==========================
      // THANH TOÁN
      // ==========================

      function checkout() {
        if (cart.length === 0) {
          alert("🛒 Giỏ hàng đang trống!");
          return;
        }

        // Copy sang giỏ thanh toán
        localStorage.setItem("cart", JSON.stringify(cart));

        // Sang trang thanh toán
        window.location.href = "thanhtoan.html";
      }

      // ==========================
      // CHẠY KHI MỞ TRANG
      // ==========================

      renderCart();
    </script>
  </body>
</html>
