<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - SKINSHOP</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* ================= HEADER ================= */

        .header {
            background: white;
            padding: 20px 8%;
            border-bottom: 1px solid #ddd;
        }

        .header h2 {
            color: #ee4d2d;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 25px auto;
        }

        .box {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .box h3 {
            margin-bottom: 20px;
            color: #333;
        }

        /* ================= SẢN PHẨM ================= */

        .product {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .product:last-child {
            border-bottom: none;
        }

        .product img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border: 1px solid #eee;
            background: white;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .product-qty {
            color: #777;
            margin-bottom: 8px;
        }

        .product-price {
            color: #ee4d2d;
            font-weight: bold;
            font-size: 17px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #ee4d2d;
        }

        .form-group textarea {
            height: 90px;
            resize: none;
        }

        /* ================= THANH TOÁN ================= */

        .payment-option {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 4px;
        }

        .payment-option:hover {
            border-color: #ee4d2d;
        }

        .payment-option input {
            margin-right: 8px;
        }

        /* ================= TỔNG TIỀN ================= */

        .summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-text {
            font-size: 18px;
        }

        .total-price {
            color: #ee4d2d;
            font-size: 26px;
            font-weight: bold;
        }

        /* ================= NÚT ĐẶT HÀNG ================= */

        .order-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: #ee4d2d;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 18px;
            cursor: pointer;
        }

        .order-btn:hover {
            background: #d94326;
        }

        /* ================= THÀNH CÔNG ================= */

        .success {
            display: none;
            background: white;
            width: 90%;
            max-width: 700px;
            margin: 80px auto;
            padding: 50px;
            text-align: center;
            border-radius: 5px;
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .success h2 {
            color: #28a745;
            margin-bottom: 15px;
        }

        .success p {
            margin-bottom: 10px;
            color: #666;
        }

        .home-btn {
            margin-top: 25px;
            padding: 12px 30px;
            background: #ee4d2d;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 3px;
        }

        /* ================= GIỎ HÀNG TRỐNG ================= */

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .container {
                width: 95%;
            }

            .product img {
                width: 75px;
                height: 75px;
            }

            .product {
                gap: 12px;
            }

            .summary {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>


<body>


    <!-- ================= HEADER ================= -->

    <div class="header">
        <h2>🛍️ SKINSHOP - Thanh toán</h2>
    </div>


    <!-- ================= TRANG THANH TOÁN ================= -->

    <div class="container" id="checkoutPage">


        <!-- ===== SẢN PHẨM ===== -->

        <div class="box">

            <h3>📦 Sản phẩm</h3>

            <div id="productList"></div>

        </div>


        <!-- ===== THÔNG TIN NHẬN HÀNG ===== -->

        <div class="box">

            <h3>📍 Thông tin nhận hàng</h3>


            <div class="form-group">

                <label>Họ và tên</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Nhập họ và tên"
                >

            </div>


            <div class="form-group">

                <label>Số điện thoại</label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Nhập số điện thoại"
                >

            </div>


            <div class="form-group">

                <label>Địa chỉ nhận hàng</label>

                <input
                    type="text"
                    id="address"
                    placeholder="Nhập địa chỉ nhận hàng"
                >

            </div>


            <div class="form-group">

                <label>Ghi chú</label>

                <textarea
                    id="note"
                    placeholder="Ghi chú cho người bán..."
                ></textarea>

            </div>

        </div>


        <!-- ===== PHƯƠNG THỨC THANH TOÁN ===== -->

        <div class="box">

            <h3>💳 Phương thức thanh toán</h3>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="COD"
                    checked
                >

                💵 Thanh toán khi nhận hàng (COD)

            </label>


            <label class="payment-option">

                <input
                    type="radio"
                    name="payment"
                    value="BANK"
                >

                🏦 Chuyển khoản ngân hàng

            </label>

        </div>


        <!-- ===== TỔNG TIỀN ===== -->

        <div class="box">

            <div class="summary">

                <div class="total-text">
                    Tổng tiền:
                </div>

                <div
                    class="total-price"
                    id="total"
                >
                    0₫
                </div>

            </div>


            <button
                class="order-btn"
                onclick="placeOrder()"
            >
                🛒 ĐẶT HÀNG
            </button>

        </div>

    </div>


    <!-- ================= ĐẶT HÀNG THÀNH CÔNG ================= -->

    <div
        class="success"
        id="successPage"
    >

        <div class="success-icon">
            🎉
        </div>

        <h2>
            Đặt hàng thành công!
        </h2>

        <p>
            Cảm ơn bạn đã mua hàng tại SKINSHOP.
        </p>

        <p>
            Đơn hàng của bạn đã được ghi nhận.
        </p>

        <button
            class="home-btn"
            onclick="goHome()"
        >
            🏠 Tiếp tục mua hàng
        </button>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        // ==========================================
        // LẤY GIỎ HÀNG
        // ==========================================

        let cart =
            JSON.parse(
                localStorage.getItem("checkoutCart")
            ) || [];


        // ==========================================
        // HIỂN THỊ SẢN PHẨM
        // ==========================================

        function renderProducts() {

            const productList =
                document.getElementById("productList");

            productList.innerHTML = "";

            let total = 0;


            // Nếu không có sản phẩm
            if (cart.length === 0) {

                productList.innerHTML = `
                    <div class="empty">
                        🛒 Giỏ hàng đang trống
                    </div>
                `;

                document.getElementById("total").innerText = "0₫";

                return;
            }


            // Hiển thị từng sản phẩm
            cart.forEach(function(item) {

                total += item.price * item.qty;


                productList.innerHTML += `

                    <div class="product">

                        <img
                            src="${item.image}"
                            alt="${item.name}"
                        >

                        <div class="product-info">

                            <div class="product-name">
                                ${item.name}
                            </div>

                            <div class="product-qty">
                                Số lượng: ${item.qty}
                            </div>

                            <div class="product-price">
                                ${item.price.toLocaleString()}₫
                            </div>

                        </div>

                    </div>

                `;

            });


            // Hiển thị tổng tiền
            document.getElementById("total").innerText =
                total.toLocaleString() + "₫";

        }


        // ==========================================
        // ĐẶT HÀNG
        // ==========================================

        function placeOrder() {

            // Lấy thông tin khách hàng

            const name =
                document.getElementById("name")
                .value
                .trim();


            const phone =
                document.getElementById("phone")
                .value
                .trim();


            const address =
                document.getElementById("address")
                .value
                .trim();


            const note =
                document.getElementById("note")
                .value
                .trim();


            // Kiểm tra họ tên

            if (name === "") {

                alert("Vui lòng nhập họ và tên!");

                return;
            }


            // Kiểm tra số điện thoại

            if (phone === "") {

                alert("Vui lòng nhập số điện thoại!");

                return;
            }


            // Kiểm tra địa chỉ

            if (address === "") {

                alert("Vui lòng nhập địa chỉ!");

                return;
            }


            // Kiểm tra giỏ hàng

            if (cart.length === 0) {

                alert("Giỏ hàng đang trống!");

                return;
            }


            // Lấy phương thức thanh toán

            const payment =
                document.querySelector(
                    'input[name="payment"]:checked'
                ).value;


            // Tính tổng tiền

            let total = 0;

            cart.forEach(function(item) {

                total += item.price * item.qty;

            });


            // Tạo đơn hàng

            const order = {

                name: name,

                phone: phone,

                address: address,

                note: note,

                payment: payment,

                products: cart,

                total: total,

                date: new Date().toLocaleString()

            };


            // Lưu đơn hàng

            localStorage.setItem(
                "order",
                JSON.stringify(order)
            );


            // Xóa giỏ hàng

            localStorage.removeItem("checkoutCart");


            // Ẩn trang thanh toán

            document.getElementById(
                "checkoutPage"
            ).style.display = "none";


            // Hiện thông báo thành công

            document.getElementById(
                "successPage"
            ).style.display = "block";

        }


        // ==========================================
        // VỀ TRANG CHỦ
        // ==========================================

        function goHome() {

            window.location.href = "index.html";

        }


        // ==========================================
        // CHẠY KHI MỞ TRANG
        // ==========================================

        renderProducts();
   </script>

</body>

</html>
